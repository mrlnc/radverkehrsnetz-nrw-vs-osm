services:
  tileserver:
    image: maptiler/tileserver-gl
    volumes:
      - ./tiles:/tiles:ro
    command: --config /tiles/tileserver-config.json --public_url ${PUBLIC_URL:-http://osm.app.internal:8080}/tiles --verbose
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./reverse-proxy.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - tileserver