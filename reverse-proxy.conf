worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;

    keepalive_timeout  65;

    server {
        listen       80;
        server_name  osm.app.internal www.osm.app.internal;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        location /favicon.ico {
            return 404;
        }

        # PMTiles are static, self-contained files — MapLibre reads them
        # directly via HTTP range requests, which nginx supports natively
        # for on-disk files. No tileserver process needed.
        location /tiles/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=86400" always;
        }
    }
}
