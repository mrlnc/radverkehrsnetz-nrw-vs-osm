worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;

    keepalive_timeout  65;

    # Per-IP request-rate and connection-count limits. Tiles get a higher
    # request rate (MapLibre fires many small range requests per pan/zoom)
    # but a tighter connection cap and a bandwidth ceiling on long transfers,
    # so a client ignoring Range and pulling a whole 100+MB archive can't
    # saturate the VPS's uplink.
    limit_req_zone  $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=tiles:10m   rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_general:10m;
    limit_conn_zone $binary_remote_addr zone=conn_tiles:10m;
    limit_req_status  429;
    limit_conn_status 429;

    server {
        listen       80;
        server_name  osm.app.internal www.osm.app.internal;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req  zone=general burst=40 nodelay;
            limit_conn conn_general 20;

            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        location /favicon.ico {
            return 404;
        }

        # PMTiles are static, self-contained files — MapLibre reads them
        # directly via HTTP range requests, which nginx supports natively
        # for on-disk files. No tileserver process needed.
        location /tiles/ {
            limit_req  zone=tiles burst=60 nodelay;
            limit_conn conn_tiles 10;
            limit_rate_after 2m;
            limit_rate 4m;

            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=86400" always;
        }
    }
}
